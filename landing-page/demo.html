<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist Demo - Live Chat Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .demo-container { width: 100%; max-width: 420px; background: #12121a; border: 1px solid #1e1e2e; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .header { background: linear-gradient(135deg, #00d4aa, #00a8e8); padding: 20px; color: #000; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; background: rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4em; }
        .header-text h3 { font-size: 1em; font-weight: 700; }
        .header-text p { font-size: 0.8em; opacity: 0.8; }
        .status { display: flex; align-items: center; gap: 6px; font-size: 0.75em; margin-top: 2px; }
        .status-dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .chat-area { height: 380px; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .message { margin-bottom: 16px; max-width: 85%; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.ai { background: #1a1a28; border-radius: 16px 16px 16px 4px; padding: 14px; }
        .message.user { background: linear-gradient(135deg, #00d4aa, #00a8e8); color: #000; border-radius: 16px 16px 4px 16px; padding: 14px; margin-left: auto; }
        .message p { font-size: 0.95em; line-height: 1.5; }
        .typing { display: flex; gap: 4px; padding: 14px; }
        .typing span { width: 8px; height: 8px; background: #444; border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .options { padding: 16px 20px; border-top: 1px solid #1e1e2e; display: flex; flex-wrap: wrap; gap: 8px; }
        .option-btn { background: #1a1a28; border: 1px solid #2a2a3a; color: #e8e8f0; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85em; transition: all 0.2s; }
        .option-btn:hover { background: #00d4aa; color: #000; border-color: #00d4aa; }
        .booking-box { background: #1a1a28; border-radius: 12px; padding: 16px; margin-top: 12px; }
        .booking-box h4 { color: #00d4aa; margin-bottom: 10px; font-size: 0.95em; }
        .slot { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #2a2a3a; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .slot:hover { border-color: #00d4aa; }
        .slot-time { font-weight: 600; }
        .slot-avail { font-size: 0.8em; color: #00d4aa; }
        .input-area { display: flex; padding: 16px; border-top: 1px solid #1e1e2e; gap: 8px; }
        .input-area input { flex: 1; background: #1a1a28; border: 1px solid #2a2a3a; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 0.95em; outline: none; }
        .input-area input:focus { border-color: #00d4aa; }
        .send-btn { background: linear-gradient(135deg, #00d4aa, #00a8e8); border: none; color: #000; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.2em; display: flex; align-items: center; justify-content: center; }
        .badge { display: inline-block; background: #00d4aa; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; font-weight: 700; margin-bottom: 6px; }
        .confirmation { background: #0d2818; border: 1px solid #00d4aa; border-radius: 12px; padding: 16px; margin-top: 12px; }
        .confirmation h4 { color: #00d4aa; margin-bottom: 6px; }
        .confirmation p { font-size: 0.9em; color: #a0a0b8; }
        @media (max-width: 480px) { .demo-container { border-radius: 0; border: none; min-height: 100vh; } .chat-area { height: calc(100vh - 240px); } }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="header">
            <div class="avatar">🤖</div>
            <div class="header-text">
                <h3>AI Receptionist Demo</h3>
                <p>HVAC Company - Phoenix AZ</p>
                <div class="status"><span class="status-dot"></span> Online • Answers 24/7</div>
            </div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <span class="badge">AI RECEPTIONIST</span>
                <p>Hi! Thanks for calling [Company Name]. I'm your AI assistant and I'm here to help 24/7. What can I do for you today?</p>
                <div class="options" id="options">
                    <button class="option-btn" onclick="sendUser('I need AC repair')">🔧 AC Repair</button>
                    <button class="option-btn" onclick="sendUser('Heating issue')">🔥 Heating</button>
                    <button class="option-btn" onclick="sendUser('I want a quote')">💰 Get a Quote</button>
                    <button class="option-btn" onclick="sendUser('Maintenance plan')">📋 Maintenance</button>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your request..." onkeypress="if(event.key==='Enter')sendCustom()">
            <button class="send-btn" onclick="sendCustom()">➤</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        let step = 0;
        
        function addMessage(text, sender, options) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            let html = sender === 'ai' ? '<span class="badge">AI RECEPTIONIST</span>' : '';
            html += `<p>${text}</p>`;
            if (options) {
                html += '<div class="options">' + options + '</div>';
            }
            div.innerHTML = html;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typing';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }
        
        function sendUser(text) {
            addMessage(text, 'user');
            userInput.value = '';
            processAIResponse(text);
        }
        
        function sendCustom() {
            const text = userInput.value.trim();
            if (text) sendUser(text);
        }
        
        const responses = {
            'repair': {
                text: "I'm sorry to hear about the issue! I can get you scheduled with one of our techs. What day works best for you — today or tomorrow?",
                slots: true
            },
            'heating': {
                text: "Heating problems are no fun, especially in this heat! Let's get you fixed up. I have availability today at 2 PM or tomorrow at 9 AM. Which works?",
                slots: true
            },
            'quote': {
                text: "Happy to get you a quote! Our diagnostic visit is $49 (free if you proceed with repairs). Would you prefer a morning or afternoon slot?",
                slots: true
            },
            'maintenance': {
                text: "Great choice! Our maintenance plan starts at $149/year and includes 2 priority tune-ups. I can sign you up and schedule your first visit. Want to proceed?",
                options: '<button class="option-btn" onclick="sendUser(\'Yes, sign me up!\')">✅ Yes, sign me up!</button><button class="option-btn" onclick="sendUser(\'Tell me more first\')">ℹ️ Tell me more</button>'
            },
            'booked': {
                text: "You're all set! 🎉<br><br>📅 Confirmed: [Day] at [Time]<br>📍 We'll come to you<br>💲 Diagnosis: $49 (waived with repair)<br><br>I just sent a confirmation SMS to your phone. You'll get a reminder 1 hour before. Is there anything else?",
                confirmation: true
            },
            'default': {
                text: "I can help with that! Most of our customers call about AC repair, heating issues, or maintenance plans. What's your situation?",
                options: '<button class="option-btn" onclick="sendUser(\'I need AC repair\')">🔧 AC Repair</button><button class="option-btn" onclick="sendUser(\'Heating issue\')">🔥 Heating</button><button class="option-btn" onclick="sendUser(\'Maintenance plan\')">📋 Maintenance</button>'
            }
        };
        
        function processAIResponse(userText) {
            showTyping();
            setTimeout(() => {
                removeTyping();
                const lower = userText.toLowerCase();
                
                if (lower.includes('ac') || lower.includes('repair') || lower.includes('cooling')) {
                    addMessage(responses.repair.text, 'ai', `
                        <div class="booking-box">
                            <h4>📅 Available Slots</h4>
                            <div class="slot" onclick="sendUser('Today at 2 PM')"><span>Today</span><span class="slot-avail">2:00 PM ✅</span></div>
                            <div class="slot" onclick="sendUser('Tomorrow at 9 AM')"><span>Tomorrow</span><span class="slot-avail">9:00 AM ✅</span></div>
                            <div class="slot" onclick="sendUser('Tomorrow at 1 PM')"><span>Tomorrow</span><span class="slot-avail">1:00 PM ✅</span></div>
                        </div>
                    `);
                } else if (lower.includes('heat') || lower.includes('furnace')) {
                    addMessage(responses.heating.text, 'ai', `
                        <div class="booking-box">
                            <h4>📅 Available Slots</h4>
                            <div class="slot" onclick="sendUser('Today at 2 PM')"><span>Today</span><span class="slot-avail">2:00 PM ✅</span></div>
                            <div class="slot" onclick="sendUser('Tomorrow at 9 AM')"><span>Tomorrow</span><span class="slot-avail">9:00 AM ✅</span></div>
                        </div>
                    `);
                } else if (lower.includes('quote') || lower.includes('estimate') || lower.includes('diagnostic')) {
                    addMessage(responses.quote.text, 'ai', `
                        <div class="booking-box">
                            <h4>📅 Available Slots</h4>
                            <div class="slot" onclick="sendUser('Tomorrow at 9 AM')"><span>Tomorrow</span><span class="slot-avail">9:00 AM ✅</span></div>
                            <div class="slot" onclick="sendUser('Tomorrow at 1 PM')"><span>Tomorrow</span><span class="slot-avail">1:00 PM ✅</span></div>
                        </div>
                    `);
                } else if (lower.includes('maintenance') || lower.includes('plan') || lower.includes('tune')) {
                    addMessage(responses.maintenance.text, 'ai', responses.maintenance.options);
                } else if (lower.includes('today') || lower.includes('tomorrow') || lower.includes('2 pm') || lower.includes('9 am') || lower.includes('yes') || lower.includes('sign me up')) {
                    addMessage(responses.booked.text, 'ai', `
                        <div class="confirmation">
                            <h4>✅ Appointment Confirmed</h4>
                            <p>📱 SMS confirmation sent<br>⏰ 1-hr reminder scheduled<br>👤 Mike will be your technician</p>
                        </div>
                        <div class="options" style="margin-top:12px">
                            <button class="option-btn" onclick="addMessage('Thanks, that\\'s all!', 'user'); setTimeout(()=>addMessage('You\\'re welcome! Have a great day. 🤖', 'ai'), 500)">👋 That's all</button>
                        </div>
                    `);
                } else {
                    addMessage(responses.default.text, 'ai', responses.default.options);
                }
            }, 1200);
        }
    </script>
</body>
</html>
